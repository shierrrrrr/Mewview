name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a problem?
      description: A clear description of the problem or need this would solve.

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
