name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches the version in the project file
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          [xml]$project = Get-Content src/Mewview/Mewview.csproj
          $version = $project.Project.PropertyGroup |
            ForEach-Object { $_.Version } |
            Where-Object { $_ } |
            Select-Object -First 1
          if (-not $version) {
            Write-Error 'No <Version> element found in src/Mewview/Mewview.csproj.'
            exit 1
          }
          if ($tag -ne $version) {
            Write-Error "Tag '${{ github.ref_name }}' does not match <Version>$version</Version>. Bump the version, or re-tag."
            exit 1
          }
          Write-Host "Version check OK: tag ${{ github.ref_name }} matches <Version>$version</Version>."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64, self-contained)
        shell: pwsh
        run: dotnet publish src/Mewview/Mewview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -o publish/win-x64

      - name: Package ZIP
        shell: pwsh
        run: |
          $zip = "Mewview-${{ github.ref_name }}-win-x64-portable.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Write-Host "Created $zip ($((Get-Item $zip).Length) bytes)"
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mewview ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Mewview-*-win-x64-portable.zip
            SHA256SUMS.txt
